    <meta name="twitter:card"        content="summary_large_image" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ─── STRUCTURED DATA (JSON-LD) ───────────────────────────── -->
    <!--
      This tells Google who you are and triggers your logo in search results.

      ACTION REQUIRED before deploying:
        1. Add your logo to /public/logo.png (512×512px square recommended)
        2. Add a preview image to /public/og-cover.png (1200×630px)
        3. Verify at https://search.google.com/test/rich-results
        4. Submit sitemap in Google Search Console
    -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Yassine Jdair",
            "url": "https://www.yassinejdair.dev",
            "image": {
                "@type": "ImageObject",
                "url": "https://www.yassinejdair.dev/logo.png",
                "width": 512,
                "height": 512
            },
            "logo": {
                "@type": "ImageObject",
                "url": "https://www.yassinejdair.dev/logo.png",
                "width": 512,
                "height": 512
            },
            "jobTitle": "Software Engineer",
            "worksFor": {
                "@type": "Organization",
                "name": "Dell Technologies"
            },
            "address": {
                "@type": "PostalAddress",
                "addressLocality": "Limerick",
                "addressCountry": "IE"
            },
            "email": "yassinejdair@gmail.com",
            "sameAs": [
                "https://github.com/YassineJdair",
                "https://www.linkedin.com/in/yassinejdair/",
                "https://twitter.com/YJdair"
            ]
        }
    </script>
